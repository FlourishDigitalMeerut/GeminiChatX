services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: gemini_chatx

    ports:
      - "8000:8000"

    platform: linux/amd64

    volumes:
      # Persist SQLite DB (directory-based – VPS safe)
      - ./db:/app/db

      # Persist vectorstores / data
      - ./data:/app/data
      - ./bots_vectorstores:/app/bots_vectorstores

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
