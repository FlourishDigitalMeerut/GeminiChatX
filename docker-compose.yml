services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini_chatx
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite DB
      - ./bots.db:/app/bots.db

      # Persist vectorstores / data
      - ./data:/app/data
      - ./bots_vectorstores:/app/bots_vectorstores

      # Optional: live code reload (DEV only)
      # - .:/app
    env_file:
      - .env
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
